<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Galactic Plinko – Direct Access</title>
<style>
body{margin:0;background:#010114;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:#fff;position:relative;}
.wrap{width:360px;padding:12px;position:relative;}
canvas{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.6);}
header{text-align:center;color:#ff77ff;margin-bottom:8px;font-size:20px;text-shadow:0 0 10px #ff77ff,0 0 20px #ff44ff;}
#results{margin-top:8px;padding:8px;border-radius:8px;text-align:center;font-size:16px;color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff;background:rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div class="wrap">
<header>
<h2>Galactic Plinko</h2>
<div class="hint">Click top area to drop a Ball. Maximum 50 Balls.</div>
</header>

<input type="text" id="codeInput" placeholder="Enter your code">
<button id="playBtn">Play</button>
<div id="results">Total Points: 0 | Balls Left: 50</div>
<canvas id="c" width="360" height="640"></canvas>
</div>

<script>
const CODES_JSON = 'https://gesg8899-prog.github.io/unique-code-gate/player_codes.json';
let codes = [];
let codeValid = false;

// Fetch codes from GitHub
async function loadCodes(){
  try{
    const res = await fetch(CODES_JSON + '?ts=' + Date.now());
    codes = await res.json();
  }catch(e){
    alert('Failed to load codes from server');
    console.error(e);
  }
}

// Validate code
async function validateCode(inputCode){
  await loadCodes();
  const found = codes.find(c => c.code === inputCode.toUpperCase());
  if(!found) return false;
  if(found.used) return false;
  return true;
}

const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', async ()=>{
  const inputCode = document.getElementById('codeInput').value.trim();
  if(!inputCode){ alert('Please enter a code'); return; }
  const valid = await validateCode(inputCode);
  if(!valid){ alert('Code not found or already used'); return; }
  codeValid = true;
  document.getElementById('codeInput').style.display='none';
  playBtn.style.display='none';
  initGame();
  loop();
});

// ===== PLINKO GAME =====
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const resultsEl=document.getElementById('results');

let coins=[],points=0,ballsLeft=50;

canvas.addEventListener('pointerdown',ev=>{
  if(!codeValid || ballsLeft<=0) return;
  const rect=canvas.getBoundingClientRect();
  const px=(ev.clientX-rect.left)*(canvas.width/rect.width);
  coins.push({x:px,y:36,vx:(Math.random()-0.5)*0.6,vy:0,r:6,finished:false});
  ballsLeft--; updateResults();
});

function update(){
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i]; c.vy+=0.28;c.x+=c.vx;c.y+=c.vy;
    if(c.x-c.r<0){c.x=c.r;c.vx*=-1;}
    if(c.x+c.r>W){c.x=W-c.r;c.vx*=-1;}
    if(c.y>H){c.finished=true;coins.splice(i,1);points+=1;updateResults();}
  }
}

function draw(){
  ctx.fillStyle='#010114';
  ctx.fillRect(0,0,W,H);
  coins.forEach(c=>{
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fillStyle='#0ff';
    ctx.fill();
  });
}

function updateResults(){
  resultsEl.textContent=`Total Points: ${points} | Balls Left: ${ballsLeft}`;
}

function loop(){update();draw();requestAnimationFrame(loop);}

// Placeholder initGame
function initGame(){coins=[];points=0;ballsLeft=50;updateResults();}
</script>
</body>
</html>
