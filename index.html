<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Plinko</title>
<style>
body{margin:0;background:#010114;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:#fff;position:relative;}
.wrap{width:360px;padding:12px;position:relative;}
canvas{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.6);}
header{text-align:center;color:#ff77ff;margin-bottom:8px;font-size:20px;text-shadow:0 0 8px #ff77ff;}
#pointsGrid{display:flex;justify-content:space-around;margin:12px 0 4px 0;}
.pointBox{width:40px;height:40px;background:rgba(255,255,255,0.05);border:2px solid #0ff;border-radius:6px;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:14px;color:#0ff;}
#pointsBar{margin:6px 0;background:rgba(0,0,0,0.3);border-radius:6px;height:20px;width:100%;display:flex;overflow:hidden;position:relative;}
#pointsFill{height:100%;width:0%;transition:width 0.3s ease;border-radius:4px;}
#pointsText{position:absolute;left:50%;top:0;transform:translateX(-50%);color:#fff;font-weight:700;font-size:14px;}
#results{margin-top:6px;padding:6px;border-radius:6px;text-align:center;font-size:14px;color:#0ff;background:rgba(0,0,0,0.2);}
#targets{margin-top:4px;padding:4px;border-radius:6px;text-align:center;font-size:12px;color:#ff9;}
.floatingPoint{position:absolute;font-weight:bold;font-size:16px;color:#ff0;pointer-events:none;animation:floatUp 0.8s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-30px);}}
#winPopup,#losePopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:10;display:none;flex-direction:column;}
#winPopup.active,#losePopup.active{display:flex;}
.popupContent{background:linear-gradient(180deg,#0ff,#44f);padding:16px 20px;border-radius:12px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.6);}
.popupContent h2{color:#ff0;margin-bottom:8px;}
.popupContent p{color:#fff;margin-bottom:8px;}
.popupContent button{margin-top:8px;background:linear-gradient(90deg,#ff9f1c,#ffbf69);color:#022;cursor:pointer;padding:6px 12px;border-radius:6px;border:none;font-weight:700;}
#musicToggle{position:absolute;top:8px;right:8px;padding:6px 10px;background:#ff0;color:#022;border:none;border-radius:6px;font-weight:bold;cursor:pointer;z-index:20;}
</style>
</head>
<body>
<div class="wrap">
<header>
<h2>Galactic Plinko</h2>
<div class="hint">Tap top area to drop a Ball. Max 50 Balls.</div>
</header>

<canvas id="c" width="360" height="640"></canvas>

<div id="pointsGrid"></div>
<div id="pointsBar"><div id="pointsFill"></div><div id="pointsText">0%</div></div>
<div id="results">Total Points: 0 | Balls Left: 50</div>
<div id="targets">Target $3: 58 | Target $6: 63</div>
</div>

<button id="musicToggle">Mute</button>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

<div id="winPopup">
<div class="popupContent">
<h2 id="winTitle">🎉 CONGRATS! 🎉</h2>
<p id="winText">Take screenshot & claim reward!</p>
<a href="https://t.me/GE88SG_Wallet" target="_blank"><button>Claim Reward</button></a>
</div>
</div>

<div id="losePopup">
<div class="popupContent">
<h2>TRY AGAIN!</h2>
<p>You didn’t reach minimum points.</p>
<button id="loseCloseBtn">Close</button>
</div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pointsFill=document.getElementById('pointsFill'),pointsText=document.getElementById('pointsText');
const resultsEl=document.getElementById('results'),pointsGrid=document.getElementById('pointsGrid');
const winPopup=document.getElementById('winPopup'),losePopup=document.getElementById('losePopup');
const winTitle=document.getElementById('winTitle'),winText=document.getElementById('winText');

let coins=[],planets=[],astronauts=[];
let ballsLeft=50,points=0,gameOver=false;

if(localStorage.getItem('plinkoPlayed')==='true'){gameOver=true; alert("You’ve already played this game.");}

const ROWS=6,COLS=6,GRAVITY=0.25,BOUNCE=0.85,COIN_RADIUS=6,PLANET_RADIUS=18;
const planetPNGUrls=[
'https://static.gwvkyk.com/media/12dc37efda1968e838ea3.png',
'https://static.gwvkyk.com/media/7b885200ea196d8678586.png',
'https://static.gwvkyk.com/media/c7933a00ea1965020c2e2.png'
];
const planetImages=planetPNGUrls.map(url=>{const img=new Image();img.src=url;return img;});
const slotPoints=[0.5,0.5,0.5,0.5,0.5,0.5,1,1,1,2,2,3];

function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function generatePlanets(){planets=[];const left=30,gap=(W-left*2)/(COLS-1);for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){planets.push({x:left+c*gap+(r%2?gap/2:0),y:120+r*70,r:PLANET_RADIUS,img:planetImages[Math.floor(Math.random()*planetImages.length)]});}}}
function initGame(){coins=[];points=0;ballsLeft=50;gameOver=false;generatePlanets();setupPointsGrid();updateResultsText();}
function setupPointsGrid(){pointsGrid.innerHTML='';shuffle([...slotPoints]).forEach(p=>{const box=document.createElement('div');box.className='pointBox';box.textContent=p;pointsGrid.appendChild(box);});}

canvas.addEventListener('pointerdown',ev=>{
  if(ballsLeft<=0||gameOver) return;
  const rect=canvas.getBoundingClientRect();
  const px=(ev.clientX-rect.left)*(canvas.width/rect.width);
  coins.push({x:Math.max(COIN_RADIUS,Math.min(W-COIN_RADIUS,px)),y:36,vx:(Math.random()-0.5)*0.6,vy:0,r:COIN_RADIUS,trail:[],collected:false,finished:false});
  ballsLeft--;updateResultsText();
});

function reflect(vx,vy,nx,ny,damp=BOUNCE){const dot=vx*nx+vy*ny;return {vx:(vx-2*dot*nx)*damp,vy:(vy-2*dot*ny)*damp};}
function createFloatingPoint(x,y,value){const span=document.createElement('div');span.className='floatingPoint';span.textContent='+'+value;span.style.left=x+'px';span.style.top=y+'px';document.querySelector('.wrap').appendChild(span);setTimeout(()=>span.remove(),800);}

function update(){
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.vy+=GRAVITY;c.x+=c.vx;c.y+=c.vy;c.trail.push({x:c.x,y:c.y}); if(c.trail.length>5)c.trail.shift();
    if(c.x-c.r<0){c.x=c.r;c.vx*=-1;} if(c.x+c.r>W){c.x=W-c.r;c.vx*=-1;}
    planets.forEach(p=>{const dx=c.x-p.x,dy=c.y-p.y,dist=Math.hypot(dx,dy),minD=c.r+p.r;if(dist<minD && dist>0.0001){const nx=dx/dist,ny=dy/dist,overlap=minD-dist;c.x+=nx*(overlap+0.2);c.y+=ny*(overlap+0.2);const nv=reflect(c.vx,c.vy,nx,ny);c.vx=nv.vx;c.vy=nv.vy-0.1;}});

    if(c.y>H-40 && !c.collected){const pointVal=slotPoints[Math.floor(Math.random()*slotPoints.length)];points+=pointVal;c.collected=true;createFloatingPoint(c.x-12,H-50,pointVal);updateResultsText();}
    if(c.y>H+50){c.finished=true;coins.splice(i,1);}
  }

  if(coins.every(c=>c.finished)&&ballsLeft===0&&!gameOver){
    if(points>=63){winTitle.textContent="🎉 YOU WIN $18!";winText.textContent="Screenshot & claim reward!";winPopup.classList.add('active');}
    else if(points>=58){winTitle.textContent="🎉 YOU WIN $3!";winText.textContent="Screenshot & claim reward!";winPopup.classList.add('active');}
    else{losePopup.classList.add('active');}
    gameOver=true;localStorage.setItem('plinkoPlayed','true');
  }
}

function drawBackground(){ctx.fillStyle='#010114';ctx.fillRect(0,0,W,H);}
function drawPlanets(){planets.forEach(p=>{if(p.img.complete){ctx.drawImage(p.img,p.x-PLANET_RADIUS,p.y-PLANET_RADIUS,PLANET_RADIUS*2,PLANET_RADIUS*2);}});}
function drawCoins(){coins.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fillStyle='#0ff';ctx.fill();});}
function draw(){drawBackground();drawPlanets();drawCoins();}
function updateResultsText(){resultsEl.innerHTML=`Total Points: ${points.toFixed(1)} | Balls Left: ${ballsLeft}`; const perc=Math.min(points/50,1);pointsFill.style.width=(perc*100)+'%';}
function loop(){update();draw();requestAnimationFrame(loop);}
initGame();loop();

const bgMusic=document.getElementById('bgMusic');
const musicToggle=document.getElementById('musicToggle');
musicToggle.addEventListener('click',()=>{if(bgMusic.paused){bgMusic.play();musicToggle.textContent='Mute';}else{bgMusic.pause();musicToggle.textContent='Unmute';}});
</script>
</body>
</html>
