<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Galactic Plinko</title>
<style>
body{margin:0;background:#010114;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:#fff;position:relative;}
.wrap{width:360px;padding:12px;position:relative;}
canvas{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.6);}
header{text-align:center;color:#ff77ff;margin-bottom:8px;font-size:20px;text-shadow:0 0 10px #ff77ff,0 0 20px #ff44ff;}
#pointsGrid{display:flex;justify-content:space-around;margin:12px 0 4px 0;}
.pointBox{width:48px;height:48px;background:rgba(255,255,255,0.05);border:2px solid #0ff;border-radius:8px;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:16px;color:#0ff;}
#pointsBar{margin:6px 0;background:rgba(0,0,0,0.3);border-radius:8px;height:24px;width:100%;display:flex;overflow:hidden;position:relative;}
#pointsFill{height:100%;width:0%;transition:width 0.3s ease;border-radius:6px;box-shadow:0 0 6px #fff inset;}
#pointsText{position:absolute;left:50%;top:0;transform:translateX(-50%);color:#fff;font-weight:700;text-shadow:0 0 6px #fff;}
#results{margin-top:8px;padding:8px;border-radius:8px;text-align:center;font-size:16px;color:#0ff;text-shadow:0 0 8px #0ff;background:rgba(0,0,0,0.2);}
#targets{margin-top:4px;padding:4px;border-radius:8px;text-align:center;font-size:14px;color:#ff9;text-shadow:0 0 6px #ff9;}
.floatingPoint{position:absolute;font-weight:bold;font-size:20px;color:#ff0;text-shadow:0 0 8px #ff0,0 0 16px #fff;pointer-events:none;animation:floatUp 1s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);} }
#winPopup,#losePopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:20;display:none;flex-direction:column;}
#winPopup.active,#losePopup.active{display:flex;}
.popupContent{background:linear-gradient(180deg,#0ff,#44f);padding:20px 28px;border-radius:14px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,0.7);}
.popupContent h2{color:#ff0;margin-bottom:12px;text-shadow:0 0 10px #ff0;}
.popupContent p{color:#fff;margin-bottom:12px;}
.popupContent button{margin-top:12px;background:linear-gradient(90deg,#ff9f1c,#ffbf69);color:#022;cursor:pointer;padding:8px 16px;border-radius:8px;border:none;font-weight:700;}
.hint{font-size:14px;color:#ff77ff;text-shadow:0 0 6px #ff77ff;}
#musicToggle{position:absolute;top:12px;right:12px;padding:8px 12px;background:#ff0;color:#022;border:none;border-radius:8px;font-weight:bold;cursor:pointer;z-index:30;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h2>Galactic Plinko</h2>
    <div class="hint">Click top area to drop a Ball. Maximum 50 Balls.</div>
  </header>

  <canvas id="c" width="360" height="640"></canvas>

  <div id="pointsGrid"></div>
  <div id="pointsBar"><div id="pointsFill"></div><div id="pointsText">0%</div></div>
  <div id="results">Total Points: 0 | Balls Left: 50</div>
  <div id="targets">Target $3: 58 points | Target $6: 63 points</div>
</div>

<button id="musicToggle">Mute</button>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

<!-- Win Popup -->
<div id="winPopup">
  <div class="popupContent">
    <h2 id="winTitle">🎉 CONGRATULATIONS! 🎉</h2>
    <p id="winText">Take a screenshot and claim your reward!</p>
    <a id="claimBtn" href="https://t.me/GE88SG_Wallet" target="_blank"><button>Claim Reward</button></a>
  </div>
</div>

<!-- Lose Popup -->
<div id="losePopup">
  <div class="popupContent">
    <img src="https://static.gwvkyk.com/media/41a1d1cdee196459257b7.gif" alt="Try Again" style="width:120px;margin-bottom:12px"/>
    <h2>TRY AGAIN!</h2>
    <p>You didn’t reach minimum points. Better luck next time!</p>
    <button id="loseCloseBtn">Close</button>
  </div>
</div>

<script>
/* CONFIG */
const PLAYER_GATE_URL = 'https://gesg8899-prog.github.io/unique-code-gate/player_gate.html';
const CLOSE_REDIRECT = 'https://ge88s.club/';

/* canvas + ui */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const pointsFill = document.getElementById('pointsFill'), pointsText = document.getElementById('pointsText');
const resultsEl = document.getElementById('results'), pointsGrid = document.getElementById('pointsGrid');
const winPopup = document.getElementById('winPopup'), losePopup = document.getElementById('losePopup');
const winTitle = document.getElementById('winTitle'), winText = document.getElementById('winText');

/* state */
let coins = [], planets = [], astronauts = [];
let ballsLeft = 50, points = 0;
let gameOver = false;
let loseRedirectTimer = null;

/* Performance-friendly constants */
const ASTRO_COUNT = 5;        // reduced
const TRAIL_MAX = 6;         // shorter trails
const STAR_COUNT = 60;       // static stars
const ROWS = 6, COLS = 6;
const GRAVITY = 0.28, BOUNCE = 0.88, COIN_RADIUS = 6, PLANET_RADIUS = 18;

/* slot values */
const slotPoints = [0.5,0.5,0.5,0.5,0.5,0.5,1,1,1,2,2,3];

/* images */
const planetPNGUrls = [
  'https://static.gwvkyk.com/media/12dc37efda1968e838ea3.png',
  'https://static.gwvkyk.com/media/7b885200ea196d8678586.png',
  'https://static.gwvkyk.com/media/c7933a00ea1965020c2e2.png'
];
const planetImages = planetPNGUrls.map(u=>{const i=new Image(); i.src=u; return i;});
const astronautImg = new Image(); astronautImg.src='https://static.gwvkyk.com/media/ef7e4c21da196c3db7efa.png';

/* ========== ACCESS / 1x PLAY CHECK ========== */
const urlParams = new URLSearchParams(window.location.search);
const code = (urlParams.get('code') || localStorage.getItem('playerCode') || '').trim().toUpperCase();
if(!code){
  alert('No access code provided. Redirecting to gate.');
  window.location.href = PLAYER_GATE_URL;
} else {
  localStorage.setItem('playerCode', code);
  // If you want per-code block already played, use played_<code>
  if(localStorage.getItem('played_' + code) === 'true' || localStorage.getItem('plinkoPlayed') === 'true'){
    alert('Kode ini sudah digunakan di browser ini. Redirecting to gate.');
    window.location.href = PLAYER_GATE_URL;
  } else {
    // mark as used in this browser immediately
    localStorage.setItem('played_' + code, 'true');
  }
}

/* ========== Pre-render static star background to offscreen canvas ========== */
const starCanvas = document.createElement('canvas');
starCanvas.width = W; starCanvas.height = H;
const sctx = starCanvas.getContext('2d');
(function drawStars(){
  sctx.fillStyle = '#010114';
  sctx.fillRect(0,0,W,H);
  for(let i=0;i<STAR_COUNT;i++){
    const x = Math.random()*W, y = Math.random()*H, r = Math.random()*1.5;
    sctx.fillStyle = `rgba(255,255,255,${Math.random()*0.35})`;
    sctx.fillRect(x,y,r,r);
  }
})();

/* helpers */
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]] } return arr; }
function createFloatingPoint(x,y,val){
  const div = document.createElement('div');
  div.className = 'floatingPoint';
  div.textContent = '+' + val;
  div.style.left = x + 'px';
  div.style.top = y + 'px';
  document.querySelector('.wrap').appendChild(div);
  setTimeout(()=>div.remove(),1000);
}

/* generate fewer astronauts for performance */
function generateAstronauts(){
  astronauts = [];
  for(let i=0;i<ASTRO_COUNT;i++){
    astronauts.push({
      x: 50 + Math.random()*(W-100),
      y: 200 + Math.random()*200,
      floatPhase: Math.random()*Math.PI*2,
      scale: 0.04 + Math.random()*0.06
    });
  }
}

/* planets */
function generatePlanets(){
  planets=[];
  const leftPadding = 30;
  const gapX = (W - leftPadding*2)/(COLS-1);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x = leftPadding + c*gapX + (r%2 ? gapX/2 : 0);
      const y = 120 + r*70;
      const img = planetImages[Math.floor(Math.random()*planetImages.length)];
      planets.push({x,y,r:PLANET_RADIUS,img,lightPhase:Math.random()*Math.PI*2});
    }
  }
}

/* init */
function setupPointsGrid(){
  pointsGrid.innerHTML = '';
  let shuffled = shuffle([...slotPoints]);
  shuffled.forEach(p=>{
    const box = document.createElement('div');
    box.className = 'pointBox';
    box.textContent = p;
    pointsGrid.appendChild(box);
  });
}

function initGame(){
  coins = []; points = 0; ballsLeft = 50;
  generateAstronauts();
  generatePlanets();
  setupPointsGrid();
  updateResultsText();
}

/* input */
canvas.addEventListener('pointerdown', ev=>{
  if(ballsLeft<=0 || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const px = (ev.clientX - rect.left) * (canvas.width / rect.width);
  coins.push({ x: Math.max(COIN_RADIUS, Math.min(W-COIN_RADIUS, px)), y:36, vx:(Math.random()-0.5)*0.6, vy:0, r:COIN_RADIUS, trail:[], collected:false, finished:false });
  ballsLeft--;
  updateResultsText();
});

/* physics */
function reflect(vx,vy,nx,ny,damp=BOUNCE){ const dot=vx*nx+vy*ny; return { vx:(vx-2*dot*nx)*damp, vy:(vy-2*dot*ny)*damp }; }

function update(){
  // animate astronauts lightly (cheap)
  const t = Date.now();
  for(const a of astronauts){
    a.x += Math.sin(t/1500 + a.floatPhase) * 0.15;
    a.y += Math.sin(t/2000 + a.floatPhase) * 0.08;
  }

  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i];
    c.vy += GRAVITY;
    c.x += c.vx; c.y += c.vy;
    // keep small trail
    c.trail.push({x:c.x,y:c.y});
    if(c.trail.length > TRAIL_MAX) c.trail.shift();

    if(c.x - c.r < 0){ c.x = c.r; c.vx *= -1; }
    if(c.x + c.r > W){ c.x = W - c.r; c.vx *= -1; }

    // planet collisions
    for(const p of planets){
      const dx = c.x - p.x, dy = c.y - p.y;
      const dist = Math.hypot(dx,dy), minD = c.r + p.r;
      if(dist < minD && dist > 0.0001){
        const nx = dx / dist, ny = dy / dist;
        const overlap = minD - dist;
        c.x += nx * (overlap + 0.2);
        c.y += ny * (overlap + 0.2);
        const nv = reflect(c.vx, c.vy, nx, ny);
        c.vx = nv.vx + (Math.random() - 0.5) * 0.04;
        c.vy = nv.vy - 0.08;
      }
    }

    // bottom scoring
    if(c.y > H - 40 && !c.collected){
      const randIndex = Math.floor(Math.random()*slotPoints.length);
      const val = slotPoints[randIndex];
      points += val; c.collected = true;
      createFloatingPoint(c.x - 12, H - 50, val);
      updateResultsText();
    }
    if(c.y > H + 50){ c.finished = true; coins.splice(i,1); }
  }

  // end condition
  if(coins.every(c=>c.finished) && ballsLeft === 0 && !gameOver){
    gameOver = true;
    localStorage.setItem('plinkoPlayed','true');
    if(points >= 63){
      winTitle.textContent = "🎉 YOU WIN $18! 🎉";
      winText.textContent = "Take a screenshot and claim your $18 reward!";
      winPopup.classList.add('active');
    } else if(points >= 58){
      winTitle.textContent = "🎉 YOU WIN $3! 🎉";
      winText.textContent = "Take a screenshot and claim your $3 reward!";
      winPopup.classList.add('active');
    } else {
      losePopup.classList.add('active');
      if(loseRedirectTimer) clearTimeout(loseRedirectTimer);
      loseRedirectTimer = setTimeout(()=> window.location.href = CLOSE_REDIRECT, 3000);
    }
  }
}

/* drawing - uses pre-rendered stars */
function drawBackground(){
  ctx.drawImage(starCanvas, 0, 0);
}

function drawPlanets(){
  for(const p of planets){
    if(p.img.complete){
      // less shadow for perf
      ctx.drawImage(p.img, p.x - PLANET_RADIUS, p.y - PLANET_RADIUS, PLANET_RADIUS*2, PLANET_RADIUS*2);
    }
  }
}

function drawCoins(){
  for(const c of coins){
    // trail (cheap)
    for(let t=0;t<c.trail.length;t++){
      const pt = c.trail[t];
      const a = (t+1)/c.trail.length * 0.28;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, c.r * (0.28 + t*0.01), 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,200,255,${a})`;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fillStyle = '#0ff';
    ctx.fill();
  }
}

function drawAstronauts(){
  for(const a of astronauts){
    if(astronautImg.complete){
      ctx.save();
      ctx.translate(a.x, a.y);
      const s = a.scale;
      ctx.drawImage(astronautImg, -astronautImg.width/2 * s, -astronautImg.height/2 * s, astronautImg.width * s, astronautImg.height * s);
      ctx.restore();
    }
  }
}

function draw(){
  drawBackground();
  drawAstronauts();
  drawPlanets();
  drawCoins();
}

function updateResultsText(){
  resultsEl.innerHTML = `<span style="color:#ff00ff;">Total Points: ${points.toFixed(1)}</span> | <span style="color:#00ffff;">Balls Left: ${ballsLeft}</span>`;
  const perc = Math.min(points/50, 1);
  let color = 'purple';
  if(perc < 0.25) color = 'red';
  else if(perc < 0.5) color = 'yellow';
  else if(perc < 0.75) color = 'lime';
  pointsFill.style.background = color;
  pointsFill.style.width = (perc*100) + '%';
  pointsText.textContent = Math.round(perc*100) + '%';
}

/* main loop */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

/* init + start */
initGame();
loop();

/* lose close button -> immediate redirect to ge88s.club */
const loseCloseBtn = document.getElementById('loseCloseBtn');
loseCloseBtn.addEventListener('click', ()=>{
  if(loseRedirectTimer) clearTimeout(loseRedirectTimer);
  window.location.href = CLOSE_REDIRECT;
});

/* music toggle */
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
musicToggle.addEventListener('click', ()=>{
  if(bgMusic.paused){ bgMusic.play(); musicToggle.textContent='Mute'; }
  else { bgMusic.pause(); musicToggle.textContent='Unmute'; }
});
</script>
</body>
</html>
