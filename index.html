<style>
body{margin:0;background:#010114;display:flex;justify-content:center;align-items:flex-start;height:100vh;font-family:Arial;color:#fff;overflow:hidden;}
.wrap{width:95vw;max-width:400px;padding:8px;position:relative;display:none;flex-direction:column;align-items:center;}
header{text-align:center;width:100%;margin-bottom:2px;}
#logo{width:60%;max-width:100px;margin:0 auto 2px auto;display:block;}
h2{margin:2px 0;font-size:1.1em;color:#ff77ff;text-shadow:0 0 6px #ff77ff;}
.hint{font-size:0.85em;color:#ff77ff;margin-bottom:4px;}
#c{width:100%;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.5);display:block;}
#pointsGrid{display:flex;flex-wrap:wrap;justify-content:space-between;margin:4px auto;width:95%;}
.pointBox{width:16%;min-width:40px;height:30px;background:rgba(255,255,255,0.05);border:2px solid #0ff;border-radius:5px;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:12px;color:#0ff;margin-bottom:2px;}
#pointsBar{margin:2px auto;background:rgba(0,0,0,0.3);border-radius:6px;height:18px;width:95%;display:flex;overflow:hidden;position:relative;}
#pointsFill{height:100%;width:0%;transition:width 0.4s ease;border-radius:6px;box-shadow:0 0 6px #fff inset;}
#pointsText{position:absolute;left:50%;top:0;transform:translateX(-50%);color:#fff;font-weight:700;font-size:12px;}
#results{margin:2px auto;padding:2px;border-radius:6px;text-align:center;font-size:12px;color:#0ff;background:rgba(0,0,0,0.2);width:95%;}
#targets{margin:1px auto;padding:1px;border-radius:5px;text-align:center;font-size:11px;color:#ff9;width:95%;}
.floatingPoint{position:absolute;font-weight:bold;font-size:18px;color:#ff0;text-shadow:0 0 8px #ff0,0 0 16px #fff;pointer-events:none;animation:floatUp 1s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
#winPopup,#losePopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:10;display:none;flex-direction:column;}
#winPopup.active,#losePopup.active{display:flex;}
.popupContent{background:linear-gradient(180deg,#0ff,#44f);padding:20px 28px;border-radius:14px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,0.7);}
.popupContent h2{color:#ff0;margin-bottom:12px;text-shadow:0 0 10px #ff0,0 0 20px #fff;}
.popupContent p{color:#fff;margin-bottom:12px;}
.popupContent button{margin-top:12px;background:linear-gradient(90deg,#ff9f1c,#ffbf69);color:#022;cursor:pointer;padding:8px 16px;border-radius:8px;border:none;font-weight:700;}
.popupContent img{width:120px;margin-bottom:12px;}
#musicToggle{position:absolute;top:6px;right:6px;padding:4px 6px;background:#ff0;color:#022;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:10px;z-index:20;}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#010114;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:30;color:#0ff;font-size:18px;text-shadow:0 0 10px #0ff;}
#loadingBar{width:80%;height:14px;border:2px solid #0ff;border-radius:8px;margin-top:12px;overflow:hidden;}
#loadingFill{width:0%;height:100%;background:#0ff;transition:width 0.2s ease;}
</style>

<div id="loadingScreen">
    <img src="https://static.gwvkyk.com/media/7992b73da2296d954e042.png" alt="Logo" width="80">
    <div>Loading Game...</div>
    <div id="loadingBar"><div id="loadingFill"></div></div>
</div>

<div class="wrap">
<header>
<img id="logo" src="https://static.gwvkyk.com/media/7992b73da2296d954e042.png" alt="Logo">
<h2>Galactic Plinko</h2>
<div class="hint">Tap top area to drop a Ball. Max 50 Balls.</div>
</header>

<canvas id="c" width="360" height="480"></canvas>

<div id="pointsGrid"></div>
<div id="pointsBar"><div id="pointsFill"></div><div id="pointsText">0%</div></div>
<div id="results">Total Points: 0 | Balls Left: 50</div>
<div id="targets">Target $3: 58 points | Target $6: 63 points</div>
</div>

<button id="musicToggle">Mute</button>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>
