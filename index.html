<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Galactic Plinko</title>
<style>
body{margin:0;background:#010114;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:#fff;position:relative;}
.wrap{width:360px;padding:12px;position:relative;}
canvas{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.6);}
header{text-align:center;color:#ff77ff;margin-bottom:8px;font-size:20px;text-shadow:0 0 10px #ff77ff,0 0 20px #ff44ff;}
#pointsGrid{display:flex;justify-content:space-around;margin:12px 0 4px 0;}
.pointBox{width:48px;height:48px;background:rgba(255,255,255,0.05);border:2px solid #0ff;border-radius:8px;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:16px;color:#0ff;}
#pointsBar{margin:6px 0;background:rgba(0,0,0,0.3);border-radius:8px;height:24px;width:100%;display:flex;overflow:hidden;position:relative;}
#pointsFill{height:100%;width:0%;transition:width 0.4s ease;border-radius:6px;}
#pointsText{position:absolute;left:50%;top:0;transform:translateX(-50%);color:#fff;font-weight:700;}
#results{margin-top:8px;padding:8px;border-radius:8px;text-align:center;font-size:16px;color:#0ff;background:rgba(0,0,0,0.2);}
#targets{text-align:center;margin-top:5px;color:#ff9;}
.floatingPoint{position:absolute;font-weight:bold;font-size:20px;color:#ff0;pointer-events:none;animation:floatUp 1s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);} }
#winPopup,#losePopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:10;flex-direction:column;}
#winPopup.active,#losePopup.active{display:flex;}
.popupContent{background:linear-gradient(180deg,#0ff,#44f);padding:20px 28px;border-radius:14px;text-align:center;}
.popupContent h2{color:#ff0;margin-bottom:12px;}
.popupContent p{color:#fff;margin-bottom:12px;}
.popupContent button{margin-top:12px;background:#ffbf00;color:#000;cursor:pointer;padding:8px 16px;border-radius:8px;border:none;font-weight:700;}
</style>
</head>
<body>

<div class="wrap">
<header>
<h2>Galactic Plinko</h2>
<p style="color:#ff77ff;font-size:14px;">Click top area to drop a Ball. Maximum 50 Balls.</p>
</header>

<canvas id="c" width="360" height="640"></canvas>

<div id="pointsGrid"></div>
<div id="pointsBar"><div id="pointsFill"></div><div id="pointsText">0%</div></div>
<div id="results">Total Points: 0 | Balls Left: 50</div>
<div id="targets">Target $3: 58 points | Target $6: 63 points</div>
</div>

<!-- WIN POPUP -->
<div id="winPopup">
<div class="popupContent">
<h2 id="winTitle">🎉 CONGRATULATIONS! 🎉</h2>
<p id="winText">Take a screenshot and claim your reward!</p>
<a href="https://t.me/GE88SG_Wallet" target="_blank">
<button>Claim Reward</button>
</a>
</div>
</div>

<!-- LOSE POPUP -->
<div id="losePopup">
<div class="popupContent">
<h2>TRY AGAIN!</h2>
<p>You didn’t reach minimum points.</p>
<button id="loseCloseBtn">Close</button>
</div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let coins=[],planets=[];
let ballsLeft=50,points=0,gameOver=false;

const ROWS=6,COLS=6,GRAVITY=0.25,COIN_RADIUS=6,PLANET_RADIUS=18;
const slotPoints=[0.5,0.5,1,1,2,3,0.5,1,1,2,2,3];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const planetPNGUrls=[
'https://static.gwvkyk.com/media/12dc37efda1968e838ea3.png',
'https://static.gwvkyk.com/media/7b885200ea196d8678586.png',
'https://static.gwvkyk.com/media/c7933a00ea1965020c2e2.png'
];
const planetImages=planetPNGUrls.map(u=>{let img=new Image();img.src=u;return img;});

function generatePlanets(){
    planets=[];
    const left=30,gapX=(W-left*2)/(COLS-1);
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const x=left + c*gapX + (r%2?gapX/2:0);
            const y=120 + r*70;
            const img=planetImages[Math.floor(Math.random()*planetImages.length)];
            planets.push({x,y,r:PLANET_RADIUS,img});
        }
    }
}

function init(){
    generatePlanets();
    setupPointGrid();
}

function setupPointGrid(){
    const grid=document.getElementById('pointsGrid');
    grid.innerHTML='';
    shuffle([...slotPoints]).forEach(p=>{
        const d=document.createElement('div');
        d.className='pointBox';
        d.textContent=p;
        grid.appendChild(d);
    });
}

canvas.addEventListener('pointerdown',ev=>{
    if(ballsLeft<=0||gameOver) return;
    const r=canvas.getBoundingClientRect();
    const x=(ev.clientX-r.left)*(canvas.width/r.width);
    coins.push({x,y:40,vx:(Math.random()-0.5)*0.6,vy:0,r:COIN_RADIUS,collected:false,finished:false});
    ballsLeft--;
    updateStats();
});

function update(){
    for(let i=coins.length-1;i>=0;i--){
        const c=coins[i];
        c.vy+=GRAVITY;
        c.x+=c.vx;c.y+=c.vy;

        if(c.x<c.r||c.x>W-c.r) c.vx*=-1;

        planets.forEach(p=>{
            const dx=c.x-p.x,dy=c.y-p.y,dist=Math.hypot(dx,dy),minD=c.r+p.r;
            if(dist<minD){
                const nx=dx/dist,ny=dy/dist;
                c.x+=nx*(minD-dist);
                c.y+=ny*(minD-dist);
                const dot=c.vx*nx+c.vy*ny;
                c.vx-=2*dot*nx;
                c.vy-=2*dot*ny;
            }
        });

        if(c.y>H-40&&!c.collected){
            const p=slotPoints[Math.floor(Math.random()*slotPoints.length)];
            points+=p;
            c.collected=true;
            updateStats();
        }

        if(c.y>H+40){c.finished=true;coins.splice(i,1);}
    }

    if(coins.length===0 && ballsLeft===0 && !gameOver){
        if(points>=63){
            document.getElementById("winPopup").classList.add("active");
        } 
        else if(points>=58){
            document.getElementById("winPopup").classList.add("active");
        }
        else{
            document.getElementById("losePopup").classList.add("active");
        }
        gameOver=true;
    }
}

function draw(){
    ctx.fillStyle="#010114";
    ctx.fillRect(0,0,W,H);

    planets.forEach(p=>{
        if(p.img.complete)
            ctx.drawImage(p.img,p.x-PLANET_RADIUS,p.y-PLANET_RADIUS,PLANET_RADIUS*2,PLANET_RADIUS*2);
    });

    // bola TANPA efek glow / cahaya
    ctx.fillStyle="#0ff";
    coins.forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
        ctx.fill();
    });
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();

function updateStats(){
    document.getElementById("results").innerHTML=
        `Total Points: ${points.toFixed(1)} | Balls Left: ${ballsLeft}`;

    let percent=Math.min(points/50,1)*100;
    const bar=document.getElementById("pointsFill");
    bar.style.width=percent+"%";
    document.getElementById("pointsText").textContent=Math.round(percent)+"%";
}

document.getElementById("loseCloseBtn").onclick=()=>{
    window.location.href="https://ge88s.club/";
};
</script>
</body>
</html>
