<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pointsFill=document.getElementById('pointsFill'),pointsText=document.getElementById('pointsText');
const resultsEl=document.getElementById('results'),pointsGrid=document.getElementById('pointsGrid');
const winPopup=document.getElementById('winPopup'),losePopup=document.getElementById('losePopup');
const winTitle=document.getElementById('winTitle'),winText=document.getElementById('winText');

let coins=[],planets=[],astronauts=[];
let ballsLeft=50,points=0;
let gameOver=false;

// Prevent replay
if(localStorage.getItem('plinkoPlayed') === 'true'){
    gameOver = true;
    alert("Oops! You’ve already played this game.");
}

// ===== GAME SETTINGS =====
const ROWS=6,COLS=6,GRAVITY=0.28,BOUNCE=0.88,COIN_RADIUS=6,PLANET_RADIUS=18;

// ========= IMAGES =========
const planetPNGUrls=[
'https://static.gwvkyk.com/media/12dc37efda1968e838ea3.png',
'https://static.gwvkyk.com/media/7b885200ea196d8678586.png',
'https://static.gwvkyk.com/media/c7933a00ea1965020c2e2.png'
];
const planetImages=planetPNGUrls.map(url=>{const img=new Image();img.src=url;return img;});

const astronautImg=new Image();
astronautImg.src='https://static.gwvkyk.com/media/ef7e4c21da196c3db7efa.png';

const slotPoints=[0.5,0.5,0.5,0.5,0.5,0.5,1,1,1,2,2,3];

// ===== SHUFFLER =====
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ====== 5 ASTRONAUTS ONLY ======
function generateAstronauts(){
    astronauts=[];
    for(let i=0;i<5;i++){
        astronauts.push({
            x:60+Math.random()*(W-120),
            y:200+Math.random()*200,
            floatPhase:Math.random()*Math.PI*2,
            scale:0.035
        });
    }
}

// ====== SMOOTHER LIGHT EFFECT ======
function generatePlanets(){
    planets=[];
    const leftPadding=30;
    const gapX=(W-leftPadding*2)/(COLS-1);
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const x=leftPadding + c*gapX + (r%2? gapX/2:0);
            const y=120 + r*70;
            planets.push({
                x,y,
                r:PLANET_RADIUS,
                img:planetImages[Math.floor(Math.random()*planetImages.length)],
                lightPhase:Math.random()*Math.PI*2
            });
        }
    }
}

function initGame(){
    coins=[]; points=0; ballsLeft=50;
    generateAstronauts();
    generatePlanets();
    setupPointsGrid();
    updateResultsText();
}

function setupPointsGrid(){
    pointsGrid.innerHTML='';
    shuffle([...slotPoints]).forEach(p=>{
        const box=document.createElement('div');
        box.className='pointBox';
        box.textContent=p;
        pointsGrid.appendChild(box);
    });
}

canvas.addEventListener('pointerdown',ev=>{
  if(ballsLeft<=0 || gameOver) return;
  const rect=canvas.getBoundingClientRect();
  const px=(ev.clientX-rect.left)*(canvas.width/rect.width);
  coins.push({
      x:Math.max(COIN_RADIUS,Math.min(W-COIN_RADIUS,px)),
      y:36,vx:(Math.random()-0.5)*0.6,vy:0,
      r:COIN_RADIUS,trail:[],collected:false,finished:false
  });
  ballsLeft--;
  updateResultsText();
});

function reflect(vx,vy,nx,ny,damp=BOUNCE){
  const dot=vx*nx+vy*ny;
  return {vx:(vx-2*dot*nx)*damp,vy:(vy-2*dot*ny)*damp};
}

function createFloatingPoint(x,y,val){
  const span=document.createElement('div');
  span.className='floatingPoint';
  span.textContent="+"+val;
  span.style.left=x+"px";
  span.style.top=y+"px";
  document.querySelector('.wrap').appendChild(span);
  setTimeout(()=>span.remove(),900);
}

function update(){
  astronauts.forEach(a=>{
    a.y += Math.sin(Date.now()/2000 + a.floatPhase) * 0.4;
  });

  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.vy+=GRAVITY; c.x+=c.vx; c.y+=c.vy;
    c.trail.push({x:c.x,y:c.y});
    if(c.trail.length>10) c.trail.shift();

    if(c.x-c.r<0){c.x=c.r;c.vx*=-1;}
    if(c.x+c.r>W){c.x=W-c.r;c.vx*=-1;}

    planets.forEach(p=>{
      const dx=c.x-p.x, dy=c.y-p.y;
      const dist=Math.hypot(dx,dy);
      const minD=c.r+p.r;
      if(dist<minD && dist>0.1){
        const nx=dx/dist, ny=dy/dist;
        c.x+=nx*(minD-dist+0.2);
        c.y+=ny*(minD-dist+0.2);
        const nv=reflect(c.vx,c.vy,nx,ny);
        c.vx=nv.vx; c.vy=nv.vy;
      }
    });

    if(c.y>H-40 && !c.collected){
      const v=slotPoints[Math.floor(Math.random()*slotPoints.length)];
      points+=v;
      c.collected=true;
      createFloatingPoint(c.x,H-60,v);
      updateResultsText();
    }

    if(c.y>H+50){
      c.finished=true;
      coins.splice(i,1);
    }
  }

  if(coins.every(x=>x.finished) && ballsLeft===0 && !gameOver){
      if(points>=63){
          winTitle.textContent="🎉 YOU WIN $18! 🎉";
          winText.textContent="Take screenshot & claim your $18 reward.";
          winPopup.classList.add('active');
      } else if(points>=58){
          winTitle.textContent="🎉 YOU WIN $3! 🎉";
          winText.textContent="Take screenshot & claim your $3 reward.";
          winPopup.classList.add('active');
      } else {
          losePopup.classList.add('active');
      }
      gameOver=true;
      localStorage.setItem('plinkoPlayed','true');
  }
}

function drawBackground(){
  ctx.fillStyle='#010114';
  ctx.fillRect(0,0,W,H);
}

function drawPlanets(){
  planets.forEach(p=>{
    if(!p.img.complete) return;
    const glow = (Math.sin(Date.now()/900 + p.lightPhase)+1)/2 * 0.4 + 0.2;
    ctx.save();
    ctx.shadowColor=`rgba(0,200,255,${glow})`;
    ctx.shadowBlur=6; 
    ctx.drawImage(p.img,p.x-PLANET_RADIUS,p.y-PLANET_RADIUS,PLANET_RADIUS*2,PLANET_RADIUS*2);
    ctx.restore();
  });
}

function drawCoins(){
  coins.forEach(c=>{
    c.trail.forEach((pt,i)=>{
      ctx.fillStyle=`rgba(0,200,255,${i/c.trail.length*0.25})`;
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,c.r*(0.3+i*0.04),0,Math.PI*2);
      ctx.fill();
    });
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fillStyle="#0ff";
    ctx.fill();
  });
}

function drawAstronauts(){
  astronauts.forEach(a=>{
    if(!astronautImg.complete) return;
    ctx.drawImage(
      astronautImg,
      a.x-astronautImg.width*a.scale/2,
      a.y-astronautImg.height*a.scale/2,
      astronautImg.width*a.scale,
      astronautImg.height*a.scale
    );
  });
}

function draw(){ drawBackground(); drawAstronauts(); drawPlanets(); drawCoins(); }

function updateResultsText(){
    resultsEl.textContent=`Total Points: ${points.toFixed(1)} | Balls Left: ${ballsLeft}`;
    const p=Math.min(points/50,1);
    pointsFill.style.width=(p*100)+'%';
    pointsText.textContent=Math.round(p*100)+'%';
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

initGame();
loop();

// ===== LOSE BUTTON → REDIRECT =====
document.getElementById('loseCloseBtn').onclick = () => {
    window.location.href = "https://ge88s.club/";
};

// Music toggle
const bgMusic=document.getElementById('bgMusic');
document.getElementById('musicToggle').onclick=()=>{
    if(bgMusic.paused){bgMusic.play();this.textContent="Mute";}
    else{bgMusic.pause();this.textContent="Unmute";}
};
</script>
